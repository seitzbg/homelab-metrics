# GitLab Omnibus bundles a set of Prometheus exporters and turns them on by
# default (Settings > Monitoring, or `prometheus_monitoring['enable'] = true`
# in /etc/gitlab/gitlab.rb). Each listens on its own port. Point all jobs at
# your GitLab host and make sure its monitoring whitelist / firewall lets your
# Prometheus reach these ports:
#   gitlab.rb -> gitlab_rails['monitoring_whitelist'] = ['<prometheus-ip>/32', ...]
# The job names below are what the dashboard's panels filter on — keep them.
scrape_configs:
  - job_name: gitlab-node
    static_configs: [{ targets: ['TARGET_HOST:9100'] }]
  - job_name: gitlab-redis
    static_configs: [{ targets: ['TARGET_HOST:9121'] }]
  - job_name: gitlab-postgres
    static_configs: [{ targets: ['TARGET_HOST:9187'] }]
  - job_name: gitlab-exporter
    static_configs: [{ targets: ['TARGET_HOST:9168'] }]
  - job_name: gitlab-workhorse
    static_configs: [{ targets: ['TARGET_HOST:9229'] }]
  - job_name: gitlab-gitaly
    static_configs: [{ targets: ['TARGET_HOST:9236'] }]
  - job_name: gitlab-sidekiq
    static_configs: [{ targets: ['TARGET_HOST:8082'] }]
  - job_name: gitlab-puma
    static_configs: [{ targets: ['TARGET_HOST:8083'] }]
