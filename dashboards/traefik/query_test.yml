# promtool unit test for the "5xx Error Ratio" panel query in dashboard.json.
# The expr below mirrors that panel with $instance -> .* and $__rate_interval ->
# 5m. Regression guard for the clamp_min(denominator, 1) bug, which understated
# the ratio at any request rate below 1/s.
#   Run: promtool test rules query_test.yml
tests:
  - interval: 10s
    input_series:
      - series: 'traefik_entrypoint_requests_total{instance="a",entrypoint="web",code="500"}'
        values: '0+1x60'
    promql_expr_test:
      # Low traffic, all failures: one request every 10s, every one a 500 -> 100%
      # (the old clamp produced 10%).
      - eval_time: 5m
        expr: '100 * sum(rate(traefik_entrypoint_requests_total{instance=~".*",code=~"5.."}[5m])) / sum(rate(traefik_entrypoint_requests_total{instance=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: 100

  - interval: 10s
    input_series:
      - series: 'traefik_entrypoint_requests_total{instance="a",entrypoint="web",code="500"}'
        values: '0+1x60'
      - series: 'traefik_entrypoint_requests_total{instance="a",entrypoint="web",code="200"}'
        values: '0+3x60'
    promql_expr_test:
      # Mixed outcomes: 5xx is 1 of every 4 requests -> 25%.
      - eval_time: 5m
        expr: '100 * sum(rate(traefik_entrypoint_requests_total{instance=~".*",code=~"5.."}[5m])) / sum(rate(traefik_entrypoint_requests_total{instance=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: 25

  - interval: 10s
    input_series:
      # A 5xx series that exists but is idle (rate 0), plus live 2xx traffic:
      # errors are 0% of a nonzero denominator, so the panel reads 0, not no-data.
      - series: 'traefik_entrypoint_requests_total{instance="a",entrypoint="web",code="500"}'
        values: '0+0x60'
      - series: 'traefik_entrypoint_requests_total{instance="a",entrypoint="web",code="200"}'
        values: '0+2x60'
    promql_expr_test:
      - eval_time: 5m
        expr: '100 * sum(rate(traefik_entrypoint_requests_total{instance=~".*",code=~"5.."}[5m])) / sum(rate(traefik_entrypoint_requests_total{instance=~".*"}[5m]))'
        exp_samples:
          - labels: '{}'
            value: 0
