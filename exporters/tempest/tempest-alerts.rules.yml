# Alerts for a Tempest station that stops reporting, or an exporter that stops
# answering. Load into Prometheus via `rule_files:` — see README.md. The
# exporter rules match the scrape job in README.md (job="tempest"); change it
# here if yours is named differently.
#
# tempest_scrape_success is no help here: when the station goes quiet (hub off
# WiFi, power lost) the WeatherFlow API still answers HTTP 200, just with no
# observations, so the polls keep succeeding. tempest_station_online — 1 while
# the newest observation is fresher than the exporter's TEMPEST_STALE_SECONDS —
# is the signal that drops.
groups:
  - name: tempest
    rules:
      # 30m rides out a hub reboot or firmware update. Per series, so with one
      # exporter per station each station alerts on its own.
      - alert: TempestStationOffline
        expr: tempest_station_online < 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tempest station {{ $labels.station }} has sent no observations for 30+ minutes."
          description: >-
            tempest_station_online is 0: the newest observation is older than
            the exporter's stale window. Check the hub's power and WiFi, and
            whether the station still shows live data on tempestwx.com. If it
            does, the exporter's cloud polls are failing instead (see
            tempest_scrape_success and the exporter logs).

      # Per scrape target, so with several exporters the one that died alerts
      # even while the others keep reporting.
      - alert: TempestExporterDown
        expr: up{job="tempest"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tempest exporter {{ $labels.instance }} has been unreachable for 30+ minutes."
          description: >-
            Prometheus cannot scrape this exporter, so its station's dashboard
            panels are empty. Check that the container is running.

      # No target left in the job: the scrape config was removed or renamed, or
      # service discovery lost the exporter.
      - alert: TempestExporterMissing
        expr: absent(up{job="tempest"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: No Prometheus target for job="tempest" for 30+ minutes.
          description: >-
            Prometheus has no Tempest scrape target, so nothing is collecting
            weather data.
