# promtool unit tests for the nightly panels in dashboard.json. The exprs
# below mirror the "Usage", "Usage — last full night" and "AHI — last full
# night" panels with $machine -> .*. They guard the rule every nightly panel
# follows: read only the finished sample loaded at exactly 12:00 UTC, never
# the live scrape, whatever instant Grafana evaluates at.
#   Run: promtool test rules query_test.yml
tests:
  # Finished nights sit at 12:00 UTC (8h for day 1, 9h for day 2). The night
  # of day 1 is read at 00:00 UTC of day 2, and also at 05:00 UTC, where a
  # browser at UTC-5 puts its daily step: the [1d:1d] subquery still evaluates
  # the inner selector at 00:00 UTC.
  - interval: 12h
    input_series:
      - series: 'sleephq_usage_seconds{machine="cpap",machine_id="1"}'
        values: '_ 28800 _ 32400 _'
    promql_expr_test:
      - eval_time: 24h
        expr: 'last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) / 3600'
        exp_samples:
          - labels: '{machine="cpap", machine_id="1"}'
            value: 8
      - eval_time: 29h
        expr: 'last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) / 3600'
        exp_samples:
          - labels: '{machine="cpap", machine_id="1"}'
            value: 8
      - eval_time: 48h
        expr: 'last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) / 3600'
        exp_samples:
          - labels: '{machine="cpap", machine_id="1"}'
            value: 9

  # Live scrape only: a 2h stub sampled every 7m, which puts samples within
  # the lookback of 12:00 UTC (11:58) but never exactly on it. The nightly
  # query must return nothing rather than the stub. The last_over_time(...[25h])
  # it replaced returns the stub here, which is the bug this guards.
  - interval: 7m
    input_series:
      - series: 'sleephq_usage_seconds{machine="cpap",machine_id="1"}'
        values: '7200+0x400'
    promql_expr_test:
      - eval_time: 24h
        expr: 'last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) / 3600'
        exp_samples: []
      - eval_time: 24h
        expr: 'last_over_time(sleephq_usage_seconds{machine=~".*"}[25h]) / 3600'
        exp_samples:
          - labels: '{machine="cpap", machine_id="1"}'
            value: 2

  # "Last full night" tiles: a finished night under 1h (day 2, 0.5h) must not
  # displace the last night with >= 1h of use (day 1, 8h, AHI 5). At hour 50
  # both tiles still read day 1.
  - interval: 12h
    input_series:
      - series: 'sleephq_usage_seconds{machine="cpap",machine_id="1"}'
        values: '_ 28800 _ 1800 _'
      - series: 'sleephq_ahi{machine="cpap",machine_id="1",type="total"}'
        values: '_ 5 _ 12 _'
    promql_expr_test:
      - eval_time: 50h
        expr: 'last_over_time((last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) >= 3600)[10d:1d]) / 3600'
        exp_samples:
          - labels: '{machine="cpap", machine_id="1"}'
            value: 8
      - eval_time: 50h
        expr: 'last_over_time((last_over_time((sleephq_ahi{machine=~".*",type="total"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) and on(machine,machine_id) (last_over_time((sleephq_usage_seconds{machine=~".*"} offset 12h and on(machine, machine_id) (timestamp(sleephq_usage_seconds offset 12h) == time() - 43200))[1d:1d]) >= 3600))[10d:1d])'
        exp_samples:
          - labels: '{__name__="sleephq_ahi", machine="cpap", machine_id="1", type="total"}'
            value: 5
