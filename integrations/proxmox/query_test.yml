# promtool unit tests for the "Current CPU" and "Guests CPU usage" panels in
# dashboard.json (exprs mirrored with $instance -> pve1). Regression guard for
# dividing pve_cpu_usage_ratio (already 0-1 utilization) by pve_cpu_usage_limit
# (the CPU count): an 8-core node at ratio 0.8 must read 0.8 (80% under the
# panels' percentunit), not 0.1.
#   Run: promtool test rules query_test.yml
tests:
  # Current CPU (nodes only): utilization used directly; the node join keeps
  # guests out. Node ratio 0.8, limit 8 -> 0.8. A guest ratio with no
  # pve_node_info must be excluded.
  - interval: 1m
    input_series:
      - series: 'pve_cpu_usage_ratio{id="node/pve1",instance="pve1"}'
        values: '0.8+0x5'
      - series: 'pve_cpu_usage_limit{id="node/pve1",instance="pve1"}'
        values: '8+0x5'
      - series: 'pve_node_info{id="node/pve1",instance="pve1"}'
        values: '1+0x5'
      - series: 'pve_cpu_usage_ratio{id="qemu/100",instance="pve1"}'
        values: '0.5+0x5'
    promql_expr_test:
      - eval_time: 3m
        expr: 'pve_cpu_usage_ratio{instance="pve1"} and on(id) pve_node_info'
        exp_samples:
          - labels: '{__name__="pve_cpu_usage_ratio", id="node/pve1", instance="pve1"}'
            value: 0.8

  # Guests CPU usage: utilization used directly, guest_info join adds name/type,
  # pve_up==1 filter preserved. Guest ratio 0.8, limit 4 -> 0.8.
  - interval: 1m
    input_series:
      - series: 'pve_cpu_usage_ratio{id="qemu/100",instance="pve1"}'
        values: '0.8+0x5'
      - series: 'pve_cpu_usage_limit{id="qemu/100",instance="pve1"}'
        values: '4+0x5'
      - series: 'pve_guest_info{id="qemu/100",instance="pve1",name="vm1",type="qemu"}'
        values: '1+0x5'
      - series: 'pve_up{id="qemu/100",instance="pve1"}'
        values: '1+0x5'
    promql_expr_test:
      - eval_time: 3m
        expr: '(pve_cpu_usage_ratio{instance="pve1"} * on(id, instance) group_left(name, type) pve_guest_info) and on(id, instance) pve_up == 1'
        exp_samples:
          - labels: '{id="qemu/100", instance="pve1", name="vm1", type="qemu"}'
            value: 0.8

  # Guests memory usage, FreeBSD guests (e.g. OPNsense): memory from the
  # guest's own node_exporter, matched to its PVE guest by nodename. Works
  # whatever job name scrapes the guest; the FreeBSD-only metric names
  # (wired/laundry) already keep Linux hosts out.
  # (2 active + 1 wired + 1 laundry) / 10 total = 0.4.
  - interval: 1m
    input_series:
      - series: 'node_memory_active_bytes{instance="fw:9100",job="node"}'
        values: '2+0x5'
      - series: 'node_memory_wired_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_laundry_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_inactive_bytes{instance="fw:9100",job="node"}'
        values: '2+0x5'
      - series: 'node_memory_cache_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_free_bytes{instance="fw:9100",job="node"}'
        values: '3+0x5'
      - series: 'node_uname_info{instance="fw:9100",job="node",nodename="fw"}'
        values: '1+0x5'
      - series: 'node_uname_info{instance="linux:9100",job="node",nodename="linuxvm"}'
        values: '1+0x5'
      - series: 'pve_guest_info{id="qemu/101",instance="pve1",name="fw.example",type="qemu"}'
        values: '1+0x5'
    promql_expr_test:
      - eval_time: 3m
        expr: 'label_replace((node_memory_active_bytes + node_memory_wired_bytes + node_memory_laundry_bytes) / (node_memory_active_bytes + node_memory_wired_bytes + node_memory_laundry_bytes + node_memory_inactive_bytes + node_memory_cache_bytes + node_memory_free_bytes) * on(instance, job) group_left(nodename) node_uname_info, "name", "$1", "nodename", "(.*)") and on(name) label_replace(pve_guest_info{instance="pve1", type="qemu"}, "name", "$1", "name", "([^.]+).*")'
        exp_samples:
          - labels: '{instance="fw:9100", job="node", name="fw", nodename="fw"}'
            value: 0.4

  # The same FreeBSD guest scraped under two jobs (e.g. "node" and a
  # dedicated firewall job): the node_uname_info join matches on (instance,
  # job), so each job's series pairs with its own uname and the query does
  # not fail with a many-to-many match.
  - interval: 1m
    input_series:
      - series: 'node_memory_active_bytes{instance="fw:9100",job="node"}'
        values: '2+0x5'
      - series: 'node_memory_wired_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_laundry_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_inactive_bytes{instance="fw:9100",job="node"}'
        values: '2+0x5'
      - series: 'node_memory_cache_bytes{instance="fw:9100",job="node"}'
        values: '1+0x5'
      - series: 'node_memory_free_bytes{instance="fw:9100",job="node"}'
        values: '3+0x5'
      - series: 'node_uname_info{instance="fw:9100",job="node",nodename="fw"}'
        values: '1+0x5'
      - series: 'node_memory_active_bytes{instance="fw:9100",job="firewall"}'
        values: '2+0x5'
      - series: 'node_memory_wired_bytes{instance="fw:9100",job="firewall"}'
        values: '1+0x5'
      - series: 'node_memory_laundry_bytes{instance="fw:9100",job="firewall"}'
        values: '1+0x5'
      - series: 'node_memory_inactive_bytes{instance="fw:9100",job="firewall"}'
        values: '2+0x5'
      - series: 'node_memory_cache_bytes{instance="fw:9100",job="firewall"}'
        values: '1+0x5'
      - series: 'node_memory_free_bytes{instance="fw:9100",job="firewall"}'
        values: '3+0x5'
      - series: 'node_uname_info{instance="fw:9100",job="firewall",nodename="fw"}'
        values: '1+0x5'
      - series: 'pve_guest_info{id="qemu/101",instance="pve1",name="fw.example",type="qemu"}'
        values: '1+0x5'
    promql_expr_test:
      - eval_time: 3m
        expr: 'label_replace((node_memory_active_bytes + node_memory_wired_bytes + node_memory_laundry_bytes) / (node_memory_active_bytes + node_memory_wired_bytes + node_memory_laundry_bytes + node_memory_inactive_bytes + node_memory_cache_bytes + node_memory_free_bytes) * on(instance, job) group_left(nodename) node_uname_info, "name", "$1", "nodename", "(.*)") and on(name) label_replace(pve_guest_info{instance="pve1", type="qemu"}, "name", "$1", "name", "([^.]+).*")'
        exp_samples:
          - labels: '{instance="fw:9100", job="node", name="fw", nodename="fw"}'
            value: 0.4
          - labels: '{instance="fw:9100", job="firewall", name="fw", nodename="fw"}'
            value: 0.4
